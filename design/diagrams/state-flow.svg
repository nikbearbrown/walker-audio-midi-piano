<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d">
<title id="t">Recovered state flow — MIDI Piano</title>
<desc id="d">Per key: Idle and Lit. Per activation: an independent voice with a fixed 8 s life. The two are not linked. References: S-01 S-02 M-03 M-05.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a040"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e06c5f"/></marker></defs>
<rect width="1400" height="560" fill="#202225"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="36" y="50" font-size="28" font-weight="700" fill="#e6e6e6">Recovered state flow — MIDI Piano</text>
<text x="36" y="78" font-size="15" fill="#9aa3ad">Per key: Idle and Lit. Per activation: an independent voice with a fixed 8 s life. The two are not linked.</text>
<rect x="36" y="520" width="30" height="18" rx="4" fill="#2b2e33" stroke="#478cbf" stroke-width="2.5"/>
<text x="76" y="534" font-size="14" fill="#9aa3ad">observed in code / logs (solid)</text>
