<text x="406" y="534" font-size="14" fill="#9aa3ad">inferred or proposed (dashed)</text>
<rect x="696" y="520" width="30" height="18" rx="4" fill="#2b2e33" stroke="#e06c5f" stroke-width="2.5" stroke-dasharray="3 4"/>
<text x="736" y="534" font-size="14" fill="#9aa3ad">missing / unverified (dotted)</text>
<text x="1364" y="534" font-size="14" fill="#9aa3ad" text-anchor="end">IDs: S-01 S-02 M-03 M-05</text>
<rect x="30" y="100" width="640" height="280" rx="10" fill="none" stroke="#9aa3ad" stroke-width="1.2"/>
<text x="42" y="122" font-size="14" font-weight="700" fill="#9aa3ad">Key (S-01)</text>
